name: Deploy Node.js app to Azure Web App - myproject1

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      id-token: write # Required for Azure login
      contents: read  # Required for actions/checkout

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Login to Azure
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZUREAPPSERVICE_CLIENTID_C9902B97672E403AB1D417A494B4D359 }}
          tenant-id: ${{ secrets.AZUREAPPSERVICE_TENANTID_2387F347B8A740D794588F0D0228C384 }}
          subscription-id: ${{ secrets.AZUREAPPSERVICE_SUBSCRIPTIONID_FFC1BB0A785649B2A59B233EC66B4A79 }}

      - name: 'Deploy to Azure Web App'
        uses: azure/webapps-deploy@v3
        with:
          app-name: 'myproject1'
          slot-name: 'Production'
          package: .
